<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="robots" content="noindex,nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登记状态 — 数智通监控</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script>
    (function(){var s=null;try{s=localStorage.getItem('dark');}catch(e){}var m=window.matchMedia('(prefers-color-scheme:dark)').matches;if(s==='1'||(s===null&&m))document.documentElement.classList.add('dark');})();
  </script>
  <link rel="stylesheet" href="{{ static_url('ui.css') }}">
  <style>{{ status_css() }}</style>
  <script src="{{ static_url('htmx.min.js') }}" defer></script>
  <script src="{{ static_url('ui.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <span class="brand-mark" style="width:30px;height:30px;border-radius:8px">{{ icon('database') }}</span>
    <span class="topbar-title">数智通监控</span>
    <span class="pill pill-neutral">只读</span>
    <div class="topbar-right">
      <button type="button" class="icon-btn" onclick="toggleDark()" title="切换明暗模式">{{ icon('sun-moon') }}</button>
    </div>
  </header>
  <main class="pub-main">
    {% include "_partials/view_content.html" %}
  </main>
</body>
</html>
