<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="robots" content="noindex,nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — 数智通监控</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script>
    (function(){var s=null;try{s=localStorage.getItem('dark');}catch(e){}var m=window.matchMedia('(prefers-color-scheme:dark)').matches;if(s==='1'||(s===null&&m))document.documentElement.classList.add('dark');})();
  </script>
  <link rel="stylesheet" href="{{ static_url('ui.css') }}">
</head>
<body class="auth">
  <div class="card auth-card">
    <div class="auth-brand">
      <span class="brand-mark">{{ icon('database') }}</span>
      <div>
        <div class="auth-title">数智通监控</div>
        <div class="auth-sub">数据知识产权登记进度监控台</div>
      </div>
    </div>

    {% if error %}
    <div class="alert alert-danger">{{ icon('alert-circle') }}<div>{{ error }}</div></div>
    {% endif %}

    <form method="post" action="/login" class="auth-form">
      <div class="field">
        <label class="label" for="login-username">用户名</label>
        <input id="login-username" class="input" type="text" name="username" required autofocus autocomplete="username"
               value="{{ form_username or '' }}">
      </div>
      <div class="field">
        <label class="label" for="login-password">密码</label>
        <input id="login-password" class="input" type="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
    <div class="auth-foot">内部系统 · 仅限授权人员使用</div>
  </div>
</body>
</html>
