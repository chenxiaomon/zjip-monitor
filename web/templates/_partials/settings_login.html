<div id="login-section" class="card">
  <div class="card-head">
    <span class="card-title">{{ icon('lock') }}登录参数</span>
    {% if saved %}<span class="pill pill-good">{{ icon('check') }}已保存</span>{% endif %}
  </div>
  <form hx-post="/settings/login"
        hx-target="#login-section"
        hx-swap="outerHTML"
        class="card-body stack">
    <div class="field-row">
      <label class="label" for="login-method">登录方式</label>
      {% set method = login.get('method', 'auto') %}
      <select id="login-method" name="method" class="select select-sm grow">
        <option value="auto" {% if method == 'auto' %}selected{% endif %}>自动（HTTP 直登，异常时回退浏览器）</option>
        <option value="http" {% if method == 'http' %}selected{% endif %}>仅 HTTP 直登</option>
        <option value="browser" {% if method == 'browser' %}selected{% endif %}>仅浏览器（Playwright）</option>
      </select>
    </div>
    <div class="field-row">
      <label class="label" for="token-age">Token 有效期（小时）</label>
      <input id="token-age" type="number" name="token_max_age_hours" value="{{ login.get('token_max_age_hours', 12) }}"
             min="1" max="72" class="input input-sm" style="width:6rem">
    </div>
    {% if error %}<div class="alert alert-danger alert-inline">{{ icon('alert-circle') }}<div>{{ error }}</div></div>{% endif %}
    <div class="field">
      <label class="check">
        <input type="checkbox" name="headless" value="on" {% if login.get('headless', True) %}checked{% endif %}>
        <span>无头模式（headless browser，仅浏览器登录时生效）</span>
      </label>
      <p class="help">服务器没有显示器，取消勾选会让浏览器登录失败；只在本机手动过验证码时取消。</p>
    </div>
    <div class="help">浏览器：{{ login.get('browser', 'chromium') }}（只读，仅浏览器登录时使用）</div>
    <div>
      <button type="submit" class="btn btn-sm btn-primary">保存参数</button>
    </div>
  </form>
</div>
