<template id="cron-tpl">
  <div class="row gap-2">
    <input type="text" name="crons" placeholder="0 9 * * *" class="input input-sm mono grow">
    <button type="button" onclick="this.parentElement.remove()" class="icon-btn" title="删除此时间点">{{ icon('x') }}</button>
  </div>
</template>

<div id="schedule-section" class="card">
  <div class="card-head">
    <span class="card-title">{{ icon('calendar-event') }}巡检计划</span>
    {% if saved %}<span class="pill pill-good">{{ icon('check') }}已保存，重启 daemon 后生效</span>{% else %}<span class="card-sub">cron 表达式 · Asia/Shanghai</span>{% endif %}
  </div>
  <div class="card-body stack">
    {% if error %}
    <div class="alert alert-danger alert-inline">{{ icon('alert-circle') }}<div>{{ error }}</div></div>
    {% endif %}
    <p class="help">修改后需在服务器重启 daemon（systemctl restart zjip-daemon）方可生效</p>
    <form hx-post="/settings/schedule"
          hx-target="#schedule-section"
          hx-swap="outerHTML"
          class="stack" style="gap:8px">
      <div id="cron-list" class="stack" style="gap:8px">
        {% for cron in crons %}
        <div class="row gap-2">
          <input type="text" name="crons" value="{{ cron }}" placeholder="0 9 * * *" class="input input-sm mono grow">
          <button type="button" onclick="this.parentElement.remove()" class="icon-btn" title="删除此时间点">{{ icon('x') }}</button>
        </div>
        {% endfor %}
      </div>
      <div>
        <button type="button"
                onclick="document.getElementById('cron-list').appendChild(document.getElementById('cron-tpl').content.cloneNode(true))"
                class="btn btn-sm btn-link">{{ icon('plus') }}添加时间点</button>
      </div>
      <div>
        <button type="submit" class="btn btn-sm btn-primary">保存计划</button>
      </div>
    </form>
  </div>
</div>
