<!-- Modal: an administrator resets someone else's password -->
<div class="modal-backdrop"
     onclick="if(event.target===this)document.getElementById('modal-container').innerHTML=''">
  <div class="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h2 class="modal-title">重置口令 · {{ user.display_name or user.username }}</h2>
      <button type="button" class="icon-btn" title="关闭" onclick="document.getElementById('modal-container').innerHTML=''">{{ icon('x') }}</button>
    </div>
    <form hx-post="/users/{{ user.username }}/password" hx-target="#modal-container" hx-swap="innerHTML">
      <div class="modal-body">
        {% if error %}
        <div class="alert alert-danger alert-inline break">{{ icon('alert-circle') }}<div>{{ error }}</div></div>
        {% endif %}
        <div class="field">
          <label class="label" for="reset-pw">新口令 <span class="req">*</span></label>
          <input id="reset-pw" type="password" name="password" required autocomplete="new-password" class="input">
        </div>
        <div class="field">
          <label class="label" for="reset-pw2">再输一次 <span class="req">*</span></label>
          <input id="reset-pw2" type="password" name="password2" required autocomplete="new-password" class="input">
          <p class="help">至少 10 位。保存后该用户在所有设备上立即退出登录</p>
        </div>
        <label class="check">
          <input type="checkbox" name="must_change" value="on" checked>
          <span>下次登录时提示该用户修改口令</span>
        </label>
      </div>
      <div class="modal-foot">
        <span></span>
        <div class="row gap-2">
          <button type="button" class="btn" onclick="document.getElementById('modal-container').innerHTML=''">取消</button>
          <button type="submit" class="btn btn-primary">重置口令</button>
        </div>
      </div>
    </form>
  </div>
</div>
