{% if ok %}
<div class="px-3 py-2 rounded-lg bg-green-50 dark:bg-green-950/40 border border-green-200 dark:border-green-800 text-sm text-green-700 dark:text-green-400 flex items-start gap-1.5">
  <i class="ti ti-circle-check text-base mt-0.5"></i>
  <span>{{ msg }}</span>
</div>
{% else %}
<div class="px-3 py-2 rounded-lg bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-sm text-red-600 dark:text-red-400 flex items-start gap-1.5">
  <i class="ti ti-circle-x text-base mt-0.5"></i>
  <span class="break-words min-w-0">{{ msg }}</span>
</div>
{% endif %}
