<div id="pause-section" class="card">
  <div class="card-body row between gap-3 row-wrap">
    <div>
      <div class="card-title">{{ icon('clock') }}定时巡检
        {% if paused %}<span class="pill pill-warn">已暂停</span>{% else %}<span class="pill pill-good">运行中</span>{% endif %}
      </div>
      <p class="xs muted mt-1">
        {% if paused %}
        已暂停 — daemon 到点将跳过巡检，正在运行的一轮不受影响
        {% else %}
        运行中 — daemon 按上方计划自动巡检
        {% endif %}
      </p>
    </div>
    <button hx-post="/settings/pause"
            hx-target="#pause-section"
            hx-swap="outerHTML"
            class="btn {% if paused %}btn-success{% else %}btn-warn{% endif %}">
      {% if paused %}
      {{ icon('player-play') }}恢复定时巡检
      {% else %}
      {{ icon('player-pause') }}暂停定时巡检
      {% endif %}
    </button>
  </div>
</div>
