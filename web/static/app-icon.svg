<!-- Source of the home-screen icons (icon-192.png, icon-512.png, apple-touch-icon.png).
     Full-bleed square: iOS and Android apply their own rounded mask, and the glyph
     stays inside the central 60% so a circular "maskable" crop never cuts it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" fill="#2563eb"/>
  <g transform="translate(116 116) scale(11.667)" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 6m-8 0a8 3 0 1 0 16 0a8 3 0 1 0 -16 0"/>
    <path d="M4 6v6a8 3 0 0 0 16 0v-6"/>
    <path d="M4 12v6a8 3 0 0 0 16 0v-6"/>
  </g>
</svg>
